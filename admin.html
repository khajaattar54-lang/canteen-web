<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Dashboard — Canteen</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    /* Force the inputs to have a specific look */
    .admin-form-card {
      background: rgba(24, 24, 27, 0.8) !important;
      backdrop-filter: blur(20px);
      padding: 32px;
      border-radius: 20px;
      border: 1px solid rgba(255,255,255,0.08) !important;
      box-shadow: 0 20px 40px rgba(0,0,0,0.4) !important;
      height: fit-content;
    }
    
    .premium-input {
      width: 100% !important;
      padding: 16px !important;
      border-radius: 12px !important;
      border: 1px solid rgba(255,255,255,0.1) !important;
      background: rgba(0,0,0,0.4) !important;
      color: white !important;
      font-family: 'Inter', sans-serif !important;
      font-size: 15px !important;
      margin-bottom: 16px !important;
      box-sizing: border-box !important;
      transition: all 0.3s ease !important;
    }

    .premium-input:focus {
      outline: none !important;
      border-color: #f97316 !important;
      background: rgba(0,0,0,0.6) !important;
      box-shadow: 0 0 15px rgba(249, 115, 22, 0.3) !important;
    }

    .premium-input::placeholder {
      color: #a1a1aa !important;
    }

    /* Fix the button text color */
    .premium-btn {
      width: 100% !important;
      padding: 16px !important;
      border-radius: 12px !important;
      border: none !important;
      background: linear-gradient(135deg, #f97316, #ea580c) !important;
      color: #ffffff !important; /* FORCES TEXT TO BE WHITE */
      font-family: 'Outfit', sans-serif !important;
      font-size: 18px !important;
      font-weight: 700 !important;
      cursor: pointer !important;
      margin-top: 8px !important;
      transition: all 0.3s ease !important;
      box-shadow: 0 4px 15px rgba(249, 115, 22, 0.4) !important;
    }

    .premium-btn:hover {
      transform: translateY(-2px) !important;
      box-shadow: 0 8px 25px rgba(249, 115, 22, 0.6) !important;
    }
  </style>
</head>
<body>
  <script>
    if (!sessionStorage.getItem('loggedInUser')) window.location.href = 'login.html';
  </script>

  <nav class="navbar">
    <h1>🍽️ Campus Canteen</h1>
    <div class="nav-links" style="display: flex; align-items: center;"></div>
  </nav>

  <div class="container">
    <h2 class="page-title">Admin Dashboard</h2>
    <p class="page-subtitle">Manage your canteen menu and stock</p>

    <div style="display: grid; grid-template-columns: 1fr 2fr; gap: 32px; margin-top: 32px;">
      
      <!-- Add New Item Form -->
      <div class="admin-form-card">
        <h3 style="font-family: 'Outfit'; margin-bottom: 24px; font-size: 22px;">Add New Item</h3>
        
        <input type="text" id="newItemName" class="premium-input" placeholder="Item Name (e.g., Cold Coffee)">
        
        <input type="number" id="newItemPrice" class="premium-input" placeholder="Price (e.g., 40)">
        
        <input type="text" id="newItemImage" class="premium-input" placeholder="Paste FULL image link here">

        <button class="premium-btn" id="addItemBtn">Add to Menu</button>
      </div>

      <!-- Manage Existing Items -->
      <div>
        <h3 style="font-family: 'Outfit'; margin-bottom: 20px; font-size: 22px;">Manage Menu</h3>
        <div id="adminMenuList" style="display: flex; flex-direction: column; gap: 16px;"></div>
      </div>

    </div>
  </div>

  <script src="js/navbar.js"></script>

  <script type="module">
    import { db } from './js/firebase.js';
    import { collection, addDoc, getDocs, doc, updateDoc, deleteDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

    const menuList = document.getElementById('adminMenuList');
    const addItemBtn = document.getElementById('addItemBtn');

    async function loadAdminMenu() {
      menuList.innerHTML = '<p style="color:var(--muted);">Loading menu...</p>';
      try {
        const snapshot = await getDocs(collection(db, 'menu_items'));
        
        if (snapshot.empty) {
          menuList.innerHTML = '<p style="color:var(--muted);">No items in the menu. Add one on the left!</p>';
          return;
        }

        menuList.innerHTML = '';
        snapshot.forEach(d => {
          const item = d.data();
          const card = document.createElement('div');
          card.className = 'order-card';
          card.style.padding = '16px';
          card.style.display = 'flex';
          card.style.justifyContent = 'space-between';
          card.style.alignItems = 'center';
          card.style.background = 'rgba(24, 24, 27, 0.6)';
          
          const isAvailable = item.available;
          const toggleColor = isAvailable ? 'var(--success)' : 'var(--danger)';
          const toggleText = isAvailable ? 'In Stock' : 'Out of Stock';

          card.innerHTML = `
            <div style="display: flex; align-items: center; gap: 16px;">
              <img src="${item.image}" style="width: 60px; height: 60px; border-radius: 12px; object-fit: cover; border: 1px solid rgba(255,255,255,0.1);">
              <div>
                <div style="font-weight: 600; font-size: 18px; color: white; margin-bottom: 4px;">${item.name}</div>
                <div style="color: var(--accent); font-weight: 700; font-size: 16px;">₹${item.price}</div>
              </div>
            </div>
            
            <div style="display: flex; gap: 12px;">
              <button class="toggle-btn" data-id="${d.id}" data-available="${isAvailable}" style="padding: 8px 16px; border-radius: 8px; border: 1px solid ${toggleColor}; background: rgba(0,0,0,0.2); color: ${toggleColor}; font-weight: 600; cursor: pointer;">
                ${toggleText}
              </button>
              <button class="delete-btn" data-id="${d.id}" style="padding: 8px 16px; border-radius: 8px; border: 1px solid rgba(239,68,68,0.5); background: rgba(239,68,68,0.1); color: #ef4444; font-weight: 600; cursor: pointer;">
                Delete
              </button>
            </div>
          `;
          menuList.appendChild(card);
        });

        document.querySelectorAll('.toggle-btn').forEach(btn => {
          btn.addEventListener('click', async (e) => {
            const id = e.target.getAttribute('data-id');
            const currentStatus = e.target.getAttribute('data-available') === 'true';
            await updateDoc(doc(db, 'menu_items', id), { available: !currentStatus });
            loadAdminMenu();
          });
        });

        document.querySelectorAll('.delete-btn').forEach(btn => {
          btn.addEventListener('click', async (e) => {
            const id = e.target.getAttribute('data-id');
            if (confirm("Are you sure you want to delete this item permanently?")) {
              await deleteDoc(doc(db, 'menu_items', id));
              loadAdminMenu();
            }
          });
        });

      } catch (error) {
        console.error("Error loading admin menu: ", error);
        menuList.innerHTML = '<p style="color:red;">Failed to load menu. Check console.</p>';
      }
    }

    addItemBtn.addEventListener('click', async () => {
      const name = document.getElementById('newItemName').value.trim();
      const price = document.getElementById('newItemPrice').value.trim();
      const image = document.getElementById('newItemImage').value.trim();

      if (!name || !price || !image) {
        alert("Please fill in all fields (Name, Price, Image URL).");
        return;
      }

      addItemBtn.innerText = 'Adding...';
      addItemBtn.disabled = true;

      try {
        await addDoc(collection(db, 'menu_items'), {
          name: name,
          price: Number(price),
          image: image,
          available: true 
        });

        document.getElementById('newItemName').value = '';
        document.getElementById('newItemPrice').value = '';
        document.getElementById('newItemImage').value = '';
        
        loadAdminMenu();
      } catch (error) {
        console.error("Error adding item: ", error);
        alert("Failed to add item: " + error.message);
      } finally {
        addItemBtn.innerText = 'Add to Menu';
        addItemBtn.disabled = false;
      }
    });

    loadAdminMenu();
  </script>
</body>
</html>
