<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login — Campus Canteen</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    body { margin: 0; padding: 0; display: flex; height: 100vh; background-color: #09090b; overflow: hidden; font-family: 'Inter', sans-serif; }
    
    /* Left Side Image */
    .login-image { flex: 1.2; background-image: url('https://images.unsplash.com/photo-1555939594-58d7cb561ad1?q=80&w=2000&auto=format&fit=crop'); background-size: cover; background-position: center; position: relative; }
    .login-image::after { content: ''; position: absolute; inset: 0; background: linear-gradient(to right, rgba(9,9,11,0.4), rgba(9,9,11,1)); }
    .image-text { position: absolute; bottom: 60px; left: 60px; z-index: 10; max-width: 400px; }
    .image-text h1 { font-family: 'Outfit', sans-serif; font-size: 48px; color: white; margin-bottom: 10px; line-height: 1.1; }
    .image-text p { color: rgba(255,255,255,0.7); font-size: 18px; }

    /* Right Side Form */
    .login-form-container { flex: 1; display: flex; justify-content: center; align-items: center; padding: 40px; background: radial-gradient(circle at 100% 0%, rgba(249, 115, 22, 0.1) 0%, transparent 50%); }
    .login-box { width: 100%; max-width: 400px; }
    
    .login-logo { font-size: 50px; margin-bottom: 10px; display: inline-block; animation: float 3s ease-in-out infinite; }
    @keyframes float { 0% { transform: translateY(0px); } 50% { transform: translateY(-10px); } 100% { transform: translateY(0px); } }
    
    .login-box h2 { font-family: 'Outfit', sans-serif; font-size: 36px; font-weight: 700; margin-bottom: 8px; color: white; }
    .login-box p { color: #a1a1aa; margin-bottom: 30px; font-size: 15px; }

    /* Premium Role Toggle */
    .role-toggle { display: flex; background: rgba(255,255,255,0.05); border-radius: 12px; padding: 4px; margin-bottom: 24px; border: 1px solid rgba(255,255,255,0.1); }
    .role-btn { flex: 1; padding: 12px; border: none; background: transparent; color: #a1a1aa; font-weight: 600; font-size: 14px; cursor: pointer; border-radius: 8px; transition: all 0.3s ease; font-family: 'Outfit', sans-serif; }
    .role-btn.active { background: var(--accent); color: white; box-shadow: 0 4px 15px rgba(249, 115, 22, 0.3); }

    .login-input { width: 100%; padding: 16px; border-radius: 12px; border: 1px solid rgba(255,255,255,0.1); background: rgba(255,255,255,0.03); color: white; margin-bottom: 20px; font-size: 15px; box-sizing: border-box; transition: all 0.3s; }
    .login-input:focus { outline: none; border-color: #f97316; background: rgba(0,0,0,0.5); box-shadow: 0 0 20px rgba(249, 115, 22, 0.2); }
    
    .login-btn { width: 100%; padding: 16px; border-radius: 12px; border: none; background: linear-gradient(135deg, #f97316, #ea580c); color: white; font-family: 'Outfit', sans-serif; font-size: 18px; font-weight: 600; cursor: pointer; margin-top: 10px; transition: all 0.3s ease; box-shadow: 0 4px 15px rgba(249, 115, 22, 0.3); }
    .login-btn:hover { transform: translateY(-2px); box-shadow: 0 8px 25px rgba(249, 115, 22, 0.5); }
    
    @media (max-width: 900px) { .login-image { display: none; } .login-form-container { flex: 1; } }
  </style>
</head>
<body>
  <div class="login-image">
    <div class="image-text">
      <h1>Delicious food,<br>delivered fast.</h1>
      <p>Pre-order your meals, skip the queue, and enjoy your break.</p>
    </div>
  </div>

  <div class="login-form-container">
    <div class="login-box">
      <div class="login-logo">🍽️</div>
      <h2>Campus Canteen</h2>
      <p>Log in to your account</p>
      
      <!-- PREMIUM ROLE TOGGLE -->
      <div class="role-toggle">
        <button class="role-btn active" id="roleStudent" onclick="setRole('student')">Student</button>
        <button class="role-btn" id="roleStaff" onclick="setRole('staff')">Staff / Admin</button>
      </div>

      <input type="text" id="loginName" class="login-input" placeholder="Your Name">
      <input type="password" id="loginPassword" class="login-input" placeholder="Password (any)">
      
      <button class="login-btn" id="loginBtn">Sign In</button>
    </div>
  </div>

  <script>
    let selectedRole = 'student';

    function setRole(role) {
      selectedRole = role;
      document.getElementById('roleStudent').classList.remove('active');
      document.getElementById('roleStaff').classList.remove('active');
      
      if (role === 'student') document.getElementById('roleStudent').classList.add('active');
      else document.getElementById('roleStaff').classList.add('active');
    }

    document.getElementById('loginBtn').addEventListener('click', () => {
      const name = document.getElementById('loginName').value.trim();
      const pass = document.getElementById('loginPassword').value.trim();
      
      if (!name || !pass) return alert("Please enter your name and password.");

      // Save the name and the chosen role
      sessionStorage.setItem('loggedInUser', name);
      sessionStorage.setItem('userRole', selectedRole);
      
      // Redirect based on role
      if (selectedRole === 'staff') {
        window.location.href = 'admin.html';
      } else {
        window.location.href = 'index.html';
      }
    });
  </script>
</body>
</html>
