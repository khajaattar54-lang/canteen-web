<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Forecast — Canteen</title>
  <link rel="stylesheet" href="css/style.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    .stats-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 24px; margin-bottom: 32px; }
    .stat-card { background: linear-gradient(145deg, rgba(26,26,36,0.9) 0%, rgba(18,18,24,0.9) 100%); padding: 24px; border-radius: 16px; border: 1px solid rgba(255,255,255,0.05); box-shadow: 0 10px 30px rgba(0,0,0,0.2); text-align: center; }
    .stat-value { font-size: 32px; font-weight: 800; font-family: 'Outfit', sans-serif; color: var(--accent); margin-bottom: 8px; }
    .stat-label { font-size: 13px; color: var(--muted); text-transform: uppercase; letter-spacing: 1px; font-weight: 600; }
  </style>
</head>
<body>
  <script>
    if (!sessionStorage.getItem('loggedInUser')) window.location.href = 'login.html';
  </script>

  <nav class="navbar">
    <h1>🍽️ Campus Canteen</h1>
    <div class="nav-links" style="display: flex; align-items: center;"></div>
  </nav>

  <div class="container">
    <h2 class="page-title">Canteen Insights</h2>
    <p class="page-subtitle">Real-time sales and rush forecast</p>

    <div class="stats-grid">
      <div class="stat-card">
        <div class="stat-value" id="totalRevenue">₹0</div>
        <div class="stat-label">Today's Revenue</div>
      </div>
      <div class="stat-card">
        <div class="stat-value" id="totalOrders">0</div>
        <div class="stat-label">Orders Today</div>
      </div>
      <div class="stat-card">
        <div class="stat-value" id="topItem" style="font-size: 24px;">-</div>
        <div class="stat-label">Most Popular Item</div>
      </div>
    </div>

    <h3 style="font-family: 'Outfit'; margin-bottom: 16px; font-size: 22px;">Rush Forecast</h3>
    <p class="page-subtitle" style="margin-bottom: 24px;">Based on last 7 days of orders</p>
    
    <div class="forecast-summary" id="summary" style="flex-direction: row;"></div>
    <div class="chart-container">
      <canvas id="forecastChart"></canvas>
    </div>
  </div>

  <script type="module" src="js/forecast.js"></script>
  <script src="js/navbar.js"></script>
</body>
</html>
