<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reviews & Hygiene — Canteen</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    select, input, textarea { color-scheme: dark; }
    select option { background-color: #18181b; color: white; padding: 10px; }
  </style>
</head>
<body>
  <script>
    if (!sessionStorage.getItem('loggedInUser')) window.location.href = 'login.html';
  </script>

  <nav class="navbar">
    <h1>🍽️ Campus Canteen</h1>
    <div class="nav-links" style="display: flex; align-items: center;"></div>
  </nav>

  <div class="container">
    <h2 class="page-title">Canteen Feedback</h2>
    <p class="page-subtitle">Food quality and hygiene ratings</p>

    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 32px; margin-top: 32px;">
      <div style="background: var(--card); padding: 32px; border-radius: 20px; border: 1px solid rgba(255,255,255,0.05); height: fit-content;">
        <h3 style="font-family: 'Outfit'; margin-bottom: 20px; font-size: 20px;">Leave a Review</h3>
        <input type="text" id="reviewName" placeholder="Your Name" style="width: 100%; padding: 14px; border-radius: 12px; border: 1px solid rgba(255,255,255,0.1); background: rgba(0,0,0,0.2); color: white; margin-bottom: 16px; font-family: 'Inter'; box-sizing: border-box;">
        
        <select id="reviewFood" style="width: 100%; padding: 14px; border-radius: 12px; border: 1px solid rgba(255,255,255,0.1); background: rgba(0,0,0,0.2); color: white; margin-bottom: 16px; font-family: 'Inter'; box-sizing: border-box; cursor: pointer;">
          <option value="Overall Canteen">Overall Canteen</option>
        </select>

        <div style="display: flex; gap: 16px; margin-bottom: 16px;">
          <div style="flex: 1;">
            <label style="font-size: 12px; color: var(--muted); margin-bottom: 4px; display: block;">Food Rating (1-5)</label>
            <select id="foodRating" style="width: 100%; padding: 12px; border-radius: 12px; border: 1px solid rgba(255,255,255,0.1); background: rgba(0,0,0,0.2); color: white; box-sizing: border-box; cursor: pointer;">
              <option value="5">⭐⭐⭐⭐⭐ (5)</option>
              <option value="4">⭐⭐⭐⭐ (4)</option>
              <option value="3">⭐⭐⭐ (3)</option>
              <option value="2">⭐⭐ (2)</option>
              <option value="1">⭐ (1)</option>
            </select>
          </div>
          <div style="flex: 1;">
            <label style="font-size: 12px; color: var(--muted); margin-bottom: 4px; display: block;">Hygiene Rating (1-5)</label>
            <select id="hygieneRating" style="width: 100%; padding: 12px; border-radius: 12px; border: 1px solid rgba(255,255,255,0.1); background: rgba(0,0,0,0.2); color: white; box-sizing: border-box; cursor: pointer;">
              <option value="5">⭐⭐⭐⭐⭐ (5)</option>
              <option value="4">⭐⭐⭐⭐ (4)</option>
              <option value="3">⭐⭐⭐ (3)</option>
              <option value="2">⭐⭐ (2)</option>
              <option value="1">⭐ (1)</option>
            </select>
          </div>
        </div>

        <textarea id="reviewText" placeholder="Write your review..." rows="4" style="width: 100%; padding: 14px; border-radius: 12px; border: 1px solid rgba(255,255,255,0.1); background: rgba(0,0,0,0.2); color: white; margin-bottom: 20px; font-family: 'Inter'; resize: none; box-sizing: border-box;"></textarea>
        <button class="btn btn-primary" id="submitReviewBtn" style="width: 100%;">Submit Review</button>
      </div>

      <div>
        <h3 style="font-family: 'Outfit'; margin-bottom: 20px; font-size: 20px;">Recent Reviews</h3>
        <div id="reviewsList"></div>
      </div>
    </div>
  </div>

  <script type="module" src="js/reviews.js"></script>
  <script src="js/navbar.js"></script>
</body>
</html>
