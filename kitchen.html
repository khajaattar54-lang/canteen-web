<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kitchen — Canteen</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <script>
    if (!sessionStorage.getItem('loggedInUser')) window.location.href = 'login.html';
  </script>

  <nav class="navbar">
    <h1>🍽️ Campus Canteen</h1>
    <div class="nav-links" style="display: flex; align-items: center;"></div>
  </nav>

  <div class="container">
    <h2 class="page-title">Live Orders</h2>
    <p class="page-subtitle">Tap to update status</p>
    <div id="kitchenList"></div>
  </div>

  <!-- NAVBAR SCRIPT -->
  <script src="js/navbar.js"></script>

  <!-- KITCHEN LOGIC SCRIPT (Directly in HTML) -->
  <script type="module">
    import { db } from './js/firebase.js';
    import { collection, query, orderBy, onSnapshot, doc, updateDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

    const list = document.getElementById('kitchenList');
    const q = query(collection(db, 'orders'), orderBy('createdAt', 'asc'));

    const NEXT_STATUS = {
      pending: 'preparing',
      preparing: 'ready',
      ready: 'collected'
    };

    onSnapshot(q, (snapshot) => {
      if (snapshot.empty) {
        list.innerHTML = '<div class="empty-state"><div class="emoji">🍳</div><p>No orders yet. Place an order from the Menu to see it here.</p></div>';
        return;
      }
      
      list.innerHTML = '';
      let hasActiveOrders = false;

      snapshot.forEach(d => {
        const o = d.data();
        
        // Skip orders that are already collected
        if (o.status === 'collected') return;
        
        hasActiveOrders = true;
        const card = document.createElement('div');
        card.className = 'order-card';
        const next = NEXT_STATUS[o.status];
        
        card.innerHTML = `
          <div class="order-header">
            <div class="token">${o.token}</div>
            <span class="status-pill status-${o.status}">${o.status}</span>
          </div>
          <div style="font-size:14px;color:var(--muted);margin-bottom:8px;">
            ${o.studentName} · ${o.slot} · <span style="color:var(--accent); font-weight:600;">${o.paymentMethod || 'Cash'}</span>
          </div>
          <div style="font-size:14px;margin-bottom:12px;">
            ${o.items.map(i => `${i.name} × ${i.qty}`).join(', ')}
          </div>
          <button class="btn btn-primary">Mark ${next}</button>
        `;
        
        card.querySelector('button').addEventListener('click', async () => {
          await updateDoc(doc(db, 'orders', d.id), { status: next });
        });
        
        list.appendChild(card);
      });

      // If all orders are collected, show a message
      if (!hasActiveOrders) {
        list.innerHTML = '<div class="empty-state"><div class="emoji">✅</div><p>All orders are completed!</p></div>';
      }
    });
  </script>
</body>
</html>
