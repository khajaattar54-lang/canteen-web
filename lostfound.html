<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lost & Found — Campus Canteen</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <script>
    if (!sessionStorage.getItem('loggedInUser')) window.location.href = 'login.html';
  </script>

  <nav class="navbar">
    <h1>🍽️ Campus Canteen</h1>
    <div class="nav-links" style="display: flex; align-items: center;"></div>
  </nav>

  <div class="container">
    <h2 class="page-title">Lost & Found</h2>
    <p class="page-subtitle">Did you forget something at the canteen?</p>

    <div style="display: grid; grid-template-columns: 1fr 2fr; gap: 32px; margin-top: 32px;">
      
      <div style="background: var(--card); padding: 32px; border-radius: 20px; border: 1px solid rgba(255,255,255,0.05); height: fit-content;">
        <h3 style="font-family: 'Outfit'; margin-bottom: 20px; font-size: 20px;">Report an Item</h3>
        
        <input type="text" id="itemName" placeholder="What did you lose/find?" style="width: 100%; padding: 14px; border-radius: 12px; border: 1px solid rgba(255,255,255,0.1); background: rgba(0,0,0,0.2); color: white; margin-bottom: 16px; font-family: 'Inter'; box-sizing: border-box;">
        
        <textarea id="itemDesc" placeholder="Description (color, brand, etc.)" rows="2" style="width: 100%; padding: 14px; border-radius: 12px; border: 1px solid rgba(255,255,255,0.1); background: rgba(0,0,0,0.2); color: white; margin-bottom: 16px; font-family: 'Inter'; resize: none; box-sizing: border-box;"></textarea>

        <label style="font-size: 12px; color: var(--muted); margin-bottom: 4px; display: block;">Upload Photo (Optional)</label>
        <input type="file" id="itemImage" accept="image/*" style="width: 100%; padding: 12px; border-radius: 12px; border: 1px dashed rgba(255,255,255,0.2); background: rgba(0,0,0,0.1); color: white; margin-bottom: 16px; font-family: 'Inter'; font-size: 13px; cursor: pointer; box-sizing: border-box;">

        <input type="text" id="itemContact" placeholder="Your Phone/Email" style="width: 100%; padding: 14px; border-radius: 12px; border: 1px solid rgba(255,255,255,0.1); background: rgba(0,0,0,0.2); color: white; margin-bottom: 24px; font-family: 'Inter'; box-sizing: border-box;">
        
        <button class="btn btn-primary" id="submitItemBtn" style="width: 100%;">Post Item</button>
      </div>

      <div>
        <h3 style="font-family: 'Outfit'; margin-bottom: 20px; font-size: 20px;">Recent Posts</h3>
        <div id="lostFoundList" style="display: grid; grid-template-columns: 1fr 1fr; gap: 16px;"></div>
      </div>

    </div>
  </div>

  <script type="module">
    import { db } from './js/firebase.js';
    import { collection, addDoc, getDocs, query, orderBy, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

    const list = document.getElementById('lostFoundList');
    const submitBtn = document.getElementById('submitItemBtn');

    async function loadItems() {
      list.innerHTML = '<p style="color:var(--muted);">Loading items...</p>';
      try {
        const q = query(collection(db, 'lost_found'), orderBy('createdAt', 'desc'));
        const snapshot = await getDocs(q);

        if (snapshot.empty) {
          list.innerHTML = '<div class="empty-state" style="padding: 40px 0; grid-column: span 2;"><div class="emoji" style="font-size: 40px;">🔍</div><p>No items reported yet.</p></div>';
          return;
        }

        list.innerHTML = '';
        snapshot.forEach(doc => {
          const item = doc.data();
          const card = document.createElement('div');
          card.className = 'order-card';
          card.style.padding = '20px';
          card.style.borderLeftColor = '#3b82f6';
          
          const dateStr = new Date(item.createdAt?.toDate() || Date.now()).toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
          const imageHtml = item.imageUrl ? `<img src="${item.imageUrl}" style="width: 100%; height: 160px; object-fit: cover; border-radius: 12px; margin-bottom: 12px; border: 1px solid rgba(255,255,255,0.1);">` : '';

          card.innerHTML = `
            ${imageHtml}
            <div style="display:flex; justify-content:space-between; align-items:flex-start; margin-bottom: 8px;">
              <div style="font-weight: 600; font-size: 16px; color: white;">${item.name}</div>
              <div style="font-size: 12px; color: var(--muted);">${dateStr}</div>
            </div>
            <p style="font-size: 14px; color: #d4d4d8; margin-bottom: 12px; line-height: 1.4;">${item.desc}</p>
            <div style="background: rgba(59,130,246,0.1); color: #60a5fa; padding: 6px 10px; border-radius: 8px; font-size: 12px; font-weight: 600; display: inline-block;">
              📞 ${item.contact}
            </div>
          `;
          list.appendChild(card);
        });
      } catch (error) {
        console.error("Error loading items: ", error);
        list.innerHTML = '<p style="color:var(--danger);">Failed to load items.</p>';
      }
    }

    submitBtn.addEventListener('click', async () => {
      const name = document.getElementById('itemName').value.trim();
      const desc = document.getElementById('itemDesc').value.trim();
      const contact = document.getElementById('itemContact').value.trim();
      const fileInput = document.getElementById('itemImage');

      if (!name || !desc || !contact) return alert('Please fill in Name, Description, and Contact.');

      submitBtn.innerText = 'Posting...';
      submitBtn.disabled = true;

      try {
        let imageUrl = "";
        if (fileInput.files && fileInput.files.length > 0) {
          const file = fileInput.files[0];
          if (file.size > 800000) {
            alert("Image is too large! Please choose an image smaller than 800KB.");
            submitBtn.innerText = 'Post Item';
            submitBtn.disabled = false;
            return;
          }
          imageUrl = await new Promise((resolve, reject) => {
            const reader = new FileReader();
            reader.onload = () => resolve(reader.result);
            reader.onerror = reject;
            reader.readAsDataURL(file);
          });
        }

        await addDoc(collection(db, 'lost_found'), {
          name, desc, contact, imageUrl, createdAt: serverTimestamp()
        });

        document.getElementById('itemName').value = '';
        document.getElementById('itemDesc').value = '';
        document.getElementById('itemContact').value = '';
        fileInput.value = '';
        
        loadItems();
      } catch (error) {
        console.error("Error adding item: ", error);
        alert("Failed to post item. Check console.");
      } finally {
        submitBtn.innerText = 'Post Item';
        submitBtn.disabled = false;
      }
    });

    loadItems();
  </script>
  <script src="js/navbar.js"></script>
</body>
</html>
